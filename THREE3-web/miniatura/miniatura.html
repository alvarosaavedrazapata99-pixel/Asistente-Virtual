<!doctype html><html><head><meta charset="utf-8"><title>Miniatura THREE3</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030712;--cyan:#3bd8f4;--blue:#3b6cf4;--cta:#f5b33a;--ring:#3a2d12;--card:#0a1128;--line:#1b2a5a}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;color:#f4f7ff;font-family:Inter,sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 85% 38% at 50% 72%,rgba(50,110,240,.55),transparent 70%),radial-gradient(ellipse 70% 25% at 50% 8%,rgba(59,216,244,.18),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.3;background-image:radial-gradient(rgba(59,216,244,.4) 1.5px,transparent 1.5px);background-size:90px 90px;mask-image:radial-gradient(ellipse 80% 55% at 50% 60%,#000,transparent 80%)}
.brand{position:absolute;top:270px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px}
.brand img{height:86px}.brand span{font:400 46px Michroma;letter-spacing:5px}
.h1{position:absolute;top:410px;left:0;right:0;text-align:center;font:400 128px/1.12 Michroma;text-shadow:0 0 60px rgba(59,216,244,.25)}
.h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 70px rgba(59,216,244,.7)}
.sub{position:absolute;top:770px;left:0;right:0;text-align:center;font:700 54px Inter}
.sub b{color:var(--cta)}
.robot{position:absolute;left:50%;top:880px;width:420px;transform:translateX(-50%);-webkit-mask-image:radial-gradient(ellipse 48% 49% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 48% 49% at 50% 50%,#000 70%,transparent 100%)}
.ring{position:absolute;left:50%;top:850px;width:700px;height:700px;margin-left:-350px;border:2px solid rgba(59,216,244,.28);border-radius:50%}
.b{position:absolute;max-width:310px;padding:22px 28px;border-radius:30px;font:600 36px/1.3 Inter;z-index:3}
.q{left:50px;top:1010px;background:#121c3d;border:2px solid var(--line);border-bottom-left-radius:10px}
.a{right:50px;top:1230px;background:linear-gradient(135deg,#2a56d6,#27b4d6);border-bottom-right-radius:10px}
.tag{position:absolute;top:1510px;left:0;right:0;text-align:center}
.tag span{display:inline-block;background:var(--cta);color:#14100a;font:800 52px Inter;padding:30px 64px;border-radius:80px;box-shadow:0 0 0 14px var(--ring)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="brand"><img src="logo-icon.png"><span>THREE3</span></div>
<div class="h1">¿VENDES<br><em>ONLINE?</em></div>
<div class="sub">Tu <b>agente IA</b> responde por ti</div>
<div class="ring"></div><img class="robot" src="robot-limpio.png">
<div class="b q">¿Tienen talla M? 👟</div>
<div class="b a">¡Sí! Te la separo ahora 🙌</div>
<div class="tag"><span>💬 Comenta CATÁLOGO</span></div>
</body></html>
