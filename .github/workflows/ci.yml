name: CI
on:
  pull_request:
  push:
    branches: [main, three3-web-carga]

defaults:
  run:
    working-directory: THREE3-web

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: THREE3-web/package-lock.json
      - run: npm ci
      - name: Tipos (web y servidor)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas (pagos, seguridad, leads, base de datos)
        run: npm test
      - name: Compilar para Cloudflare Pages (genera la CSP por hash)
        run: npm run build:cf
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: CSP sin violaciones en un navegador real
        run: node scripts/probar-csp.mjs
      - name: Presupuesto de JavaScript inicial (170 KB comprimido)
        run: |
          total=0
          for f in $(grep -o '/_next/static/chunks/[^"]*\.js' out/index.html | sort -u); do
            total=$((total + $(gzip -c "out${f}" | wc -c)))
          done
          echo "JS inicial comprimido: ${total} bytes"
          test "$total" -le 190000 || { echo "Supera el presupuesto (190000 B; meta 170000 B)"; exit 1; }

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos filtrados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
